<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070d}
body{font-family:Kanit,sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,#123a5c 0,#0a1a2e 35%,#05070d 70%)}
#dots{position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1.5px,transparent 1.5px);background-size:40px 40px}
.abs{position:absolute}
#tag{left:64px;top:90px;font-size:30px;font-weight:700;color:#05070d;background:#fbbf24;padding:8px 22px;border-radius:12px}
#brand{right:64px;top:96px;font-weight:700;font-size:38px}#brand b{color:#22d3ee}
#text{left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 50px}
#kick{font-size:92px;font-weight:700;line-height:1.15}#kick em{font-style:normal;color:#22d3ee}
#l1{font-size:80px;font-weight:700;line-height:1.2;color:#fbbf24;margin-top:6px}
.hl{display:inline-block;font-size:62px;font-weight:700;line-height:1.25;padding:4px 30px 10px;margin-top:24px;white-space:nowrap}
#b1{background:#22d3ee;color:#04121c}
#b2{background:#fff;color:#0a0f1e}
#term{left:70px;top:890px;width:640px;height:440px;border-radius:24px;background:#0d1524;border:1px solid #ffffff1f;box-shadow:0 30px 80px #000a}
#term .bar{height:50px;border-bottom:1px solid #ffffff14;display:flex;align-items:center;gap:10px;padding:0 22px}
#term .bar i{width:14px;height:14px;border-radius:50%;background:#334155}
#pre{font-family:'JetBrains Mono',monospace;font-size:27px;line-height:1.75;padding:24px 30px;color:#94a3b8;white-space:pre}
.c{color:#22d3ee}.g{color:#4ade80}.y{color:#fbbf24}
#cur{display:inline-block;width:14px;height:30px;background:#22d3ee;vertical-align:-5px}
#card{right:60px;top:840px;width:400px;padding:30px;border-radius:26px;background:#111c2fee;border:1px solid #22d3ee55;box-shadow:0 0 0 6px #22d3ee14,0 30px 70px #000c}
#card .k{font-size:22px;color:#64748b}
#card .n{font-size:50px;font-weight:700;line-height:1.1;margin-top:6px}
#card .row{display:flex;gap:12px;margin-top:20px}
.pill{font-size:24px;padding:6px 16px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff1f;color:#cbd5e1}
.pill.s{color:#fbbf24;border-color:#fbbf2455;background:#fbbf2412}
#badge{left:780px;top:1170px;width:180px;height:180px;border-radius:44px;background:linear-gradient(145deg,#22d3ee,#0ea5e9 60%,#6366f1);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px #22d3ee66}
#badge svg{width:100px;height:100px}
#sub{left:0;right:0;top:1460px;text-align:center;font-size:44px;color:#cbd5e1}
#cta{left:50%;top:1560px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;font-size:48px;font-weight:700;background:#fbbf24;color:#05070d;padding:16px 40px;border-radius:999px;white-space:nowrap}
#cta svg{width:46px;height:46px}
#foot{left:64px;right:64px;bottom:60px;display:flex;justify-content:space-between;font-size:28px;color:#64748b}
</style></head><body>
<div id="bg"></div><div id="dots"></div>
<div id="tag" class="abs">AI TOOL วันนี้</div>
<div id="brand" class="abs">botbas<b>.ai</b></div>
<div id="text" class="abs">
 <div id="kick">สาย <em>Claude Code</em> ต้องรู้!</div>
 <div id="l1">เลิกเล่าโปรเจกต์ซ้ำทุกครั้ง</div>
 <div id="b1" class="hl">claude-mem ทำให้ AI จำงานข้ามวัน</div>
 <div id="b2" class="hl">โอเพนซอร์ส ติดตั้งคำสั่งเดียว</div>
</div>
<div id="term" class="abs"><div class="bar"><i></i><i></i><i></i></div><div id="pre"></div></div>
<div id="card" class="abs"><div class="k">GITHUB · OPEN SOURCE</div><div class="n">claude-mem</div>
 <div class="row"><div class="pill s" id="stars">★ 0</div><div class="pill">TypeScript</div></div></div>
<div id="badge" class="abs"><svg viewBox="0 0 24 24" fill="none" stroke="#04121c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></div>
<div id="sub" class="abs">วิธีใช้ + ข้อควรระวัง อ่านต่อในโพสต์</div>
<div id="cta" class="abs">ลิงก์ GitHub ในคอมเมนต์ <svg viewBox="0 0 24 24" fill="none" stroke="#05070d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg></div>
<div id="foot" class="abs"><div>ใช้ AI ให้เป็น ทุกวัน 18:45</div><div>botbas.ai</div></div>
<script>
const LINES=[['g','$',' npx claude-mem install'],['c','✓',' hooks installed'],['c','✓',' memory worker started'],['','',''],['g','$',' claude'],['y','›',' loading context from'],['','','  last 3 sessions…']];
const $=id=>document.getElementById(id);
const cl=(x)=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const prog=(t,a,b)=>(t-a)/(b-a);
function set(el,o,tf){el.style.opacity=o;el.style.transform=tf}
window.render=function(t){
 $('bg').style.opacity=ease(prog(t,0,.6));
 $('dots').style.transform=`translateY(${-t*8}px)`;
 set($('tag'),ease(prog(t,.2,.6)),`translateX(${(1-ease(prog(t,.2,.6)))*-40}px)`);
 set($('brand'),ease(prog(t,.2,.6)),`translateX(${(1-ease(prog(t,.2,.6)))*40}px)`);
 let k=back(prog(t,.4,1.1)); set($('kick'),cl(prog(t,.4,.8)),`scale(${.6+.4*k})`);
 let l=ease(prog(t,1.1,1.7)); set($('l1'),l,`translateY(${(1-l)*60}px)`);
 let b1=ease(prog(t,1.8,2.4)); $('b1').style.clipPath=`inset(0 ${(1-b1)*100}% 0 0)`; $('b1').style.transform=`rotate(${-1*b1}deg)`;
 let b2=ease(prog(t,2.4,3.0)); $('b2').style.clipPath=`inset(0 0 0 ${(1-b2)*100}%)`; $('b2').style.transform=`rotate(${.8*b2}deg)`;
 let tm=ease(prog(t,3.2,3.9)); set($('term'),tm,`translateY(${(1-tm)*120}px) rotate(${-3*tm}deg)`);
 // typing
 const total=LINES.reduce((s,x)=>s+x[1].length+x[2].length,0);
 let n=Math.floor(cl(prog(t,4.0,8.0))*total), out='';
 for(const [c,p,r] of LINES){ if(n<=0)break; let s=p+r, take=s.slice(0,n); n-=s.length;
   let pp=take.slice(0,p.length), rr=take.slice(p.length);
   out+=(c&&pp?`<span class="${c}">${pp}</span>`:pp)+rr+'\n'; }
 out=out.replace(/\n$/,'')+(Math.floor(t*2.5)%2?'':'<span id="cur"></span>');
 $('pre').innerHTML=out;
 let cd=back(prog(t,4.4,5.2)); set($('card'),cl(prog(t,4.4,4.8)),`translateY(${(1-cd)*-160}px) rotate(${2.5*cd}deg)`);
 let sv=Math.round(100*ease(prog(t,4.8,6.8))); $('stars').textContent='★ '+sv+(sv>=100?'K+':'K');
 let bd=back(prog(t,6.0,6.8)); let pulse=1+.05*Math.sin(Math.max(0,t-6.8)*4);
 set($('badge'),cl(prog(t,6,6.4)),`rotate(${-6+(1-bd)*-60}deg) scale(${bd*pulse})`);
 let sb=ease(prog(t,8.4,9.0)); set($('sub'),sb,`translateY(${(1-sb)*30}px)`);
 let ct=back(prog(t,9.2,9.9)); let bob=Math.sin(Math.max(0,t-9.9)*6)*8;
 set($('cta'),cl(prog(t,9.2,9.5)),`translateX(-50%) translateY(${bob}px) scale(${.5+.5*ct})`);
 $('foot').style.opacity=ease(prog(t,.6,1.2));
};
window.render(0);
</script>
</body></html>
