<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060a18;--a:#3b82f6;--b:#6366f1;--c:#fbbf24;--ink:#ffffff;--mute:#94a3b8;--panel:#0d1530dd}
body{width:1080px;height:1350px;font-family:Prompt,sans-serif;background:var(--bg);color:var(--ink);position:relative;overflow:hidden}
#art{position:absolute;inset:0;width:1080px;height:1350px}
.tag{position:absolute;left:56px;top:46px;z-index:3;font-size:26px;font-weight:700;color:var(--tagink);background:var(--a);padding:8px 22px;border-radius:12px;letter-spacing:.5px}
.brand{position:absolute;right:56px;top:46px;z-index:3;display:flex;align-items:center;gap:14px;font-weight:700;font-size:32px}
.brand .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center}
.brand .logo svg{width:32px;height:32px}
.brand b{color:var(--a)}
.scene{position:absolute;left:90px;top:128px;width:900px;height:430px;z-index:2;filter:drop-shadow(0 22px 40px #0009)}
.scene svg{width:900px;height:430px;display:block;overflow:visible}
.text{position:absolute;left:56px;right:56px;top:560px;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.kick{font-size:80px;font-weight:700;letter-spacing:0;line-height:1.12}
.kick em{font-style:normal;color:var(--a)}
.l1{font-size:56px;font-weight:700;line-height:1.2;color:var(--c);margin-top:10px}
.box{margin-top:34px;width:100%;background:var(--panel);border:2px solid color-mix(in srgb,var(--a) 45%,transparent);border-radius:30px;padding:30px 40px;text-align:left;box-shadow:0 24px 60px #0004}
.pt{display:flex;align-items:flex-start;gap:22px;font-size:40px;font-weight:600;line-height:1.3;padding:12px 0}
.pt+.pt{border-top:1px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
.pt i{flex:none;width:48px;height:48px;margin-top:3px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center}
.pt i:after{content:"";width:18px;height:10px;border-left:5px solid var(--tagink);border-bottom:5px solid var(--tagink);transform:rotate(-45deg) translate(2px,-2px)}
.sub{font-size:34px;color:var(--mute);margin-top:28px}
.foot{position:absolute;left:56px;right:56px;bottom:34px;z-index:2;display:flex;justify-content:space-between;font-size:26px;color:var(--mute)}
