<!-- Template v2 (1080x1350). Fill every {{...}}:
 TERMINAL_HTML: 5-7 short lines for the <pre> (no leading newline), e.g. <span class="g">$</span> npx foo install / <span class="c">✓</span> done / <span class="y">›</span> ... ; keep each line <= 26 chars.
 NAME: repo name (<= 16 chars; if longer, the card font auto-wraps). STARS e.g. 12K+. LANG: main language.
 KICKER_HTML: white hook <= 18 Thai chars, wrap 1-2 key words in <em> (cyan). LINE_1: yellow line <= 22 chars.
 BAR_1: cyan bar, the key benefit with tool name <= 28 chars. BAR_2: white bar <= 24 chars. SUBLINE: small grey line <= 34 chars. No URLs anywhere. -->
<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Kanit,sans-serif;background:#05070d;color:#fff;position:relative;overflow:hidden}
/* ---------- top illustration ---------- */
.scene{position:absolute;inset:0 0 auto 0;height:720px;
 background:radial-gradient(ellipse at 70% 35%,#123a5c 0,#0a1a2e 40%,#05070d 75%)}
.scene:after{content:"";position:absolute;inset:auto 0 0 0;height:220px;background:linear-gradient(transparent,#05070d)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1.5px,transparent 1.5px);background-size:36px 36px;mask-image:radial-gradient(ellipse at 60% 40%,#000 30%,transparent 70%)}
.term{position:absolute;left:70px;top:125px;width:600px;height:400px;border-radius:22px;background:#0d1524;border:1px solid #ffffff1f;box-shadow:0 30px 80px #000a;transform:rotate(-3deg)}
.term .bar{height:46px;border-bottom:1px solid #ffffff14;display:flex;align-items:center;gap:10px;padding:0 20px}
.term .bar i{width:13px;height:13px;border-radius:50%;background:#334155}
.term pre{font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1.75;padding:22px 28px;color:#94a3b8;white-space:pre}
.term .c{color:#22d3ee}.term .g{color:#4ade80}.term .y{color:#fbbf24}
.card{position:absolute;right:70px;top:150px;width:390px;padding:28px;border-radius:24px;background:#111c2fee;border:1px solid #22d3ee55;box-shadow:0 0 0 6px #22d3ee14,0 30px 70px #000c;transform:rotate(2.5deg)}
.card .k{font-size:22px;color:#64748b;letter-spacing:.5px}
.card .n{font-size:46px;font-weight:700;line-height:1.1;margin-top:4px;word-break:break-word}
.card .row{display:flex;gap:12px;margin-top:20px}
.pill{font-size:22px;padding:6px 16px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff1f;color:#cbd5e1}
.pill.s{color:#fbbf24;border-color:#fbbf2455;background:#fbbf2412}
.badge{position:absolute;left:560px;top:470px;width:170px;height:170px;border-radius:40px;background:linear-gradient(145deg,#22d3ee,#0ea5e9 60%,#6366f1);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px #22d3ee55;transform:rotate(-6deg)}
.badge svg{width:96px;height:96px}
.brand{position:absolute;right:56px;top:44px;font-weight:700;font-size:30px;z-index:3}.brand b{color:#22d3ee}
.tag{position:absolute;left:56px;top:40px;z-index:3;font-size:24px;font-weight:700;color:#05070d;background:#fbbf24;padding:6px 18px;border-radius:10px}
/* ---------- headline ---------- */
.text{position:absolute;left:0;right:0;top:725px;padding:0 56px;display:flex;flex-direction:column;align-items:center;text-align:center}
.kick{font-size:76px;font-weight:700;line-height:1.15}
.kick em{font-style:normal;color:#22d3ee}
.l1{font-size:70px;font-weight:700;line-height:1.2;color:#fbbf24;margin-top:4px}
.hl{display:inline-block;font-size:58px;font-weight:700;line-height:1.25;padding:2px 26px 8px;margin-top:18px}
.hl.a{background:#22d3ee;color:#04121c;transform:rotate(-1deg)}
.hl.b{background:#fff;color:#0a0f1e;transform:rotate(.8deg)}
.sub{font-size:38px;color:#cbd5e1;margin-top:26px}
.foot{position:absolute;left:56px;right:56px;bottom:34px;display:flex;justify-content:space-between;font-size:24px;color:#64748b}
</style></head><body>
<div class="scene"><div class="dots"></div>
 <div class="term"><div class="bar"><i></i><i></i><i></i></div>
<pre>{{TERMINAL_HTML}}</pre></div>
 <div class="card"><div class="k">GITHUB · OPEN SOURCE</div><div class="n">{{NAME}}</div>
  <div class="row"><div class="pill s">★ {{STARS}}</div><div class="pill">{{LANG}}</div></div></div>
 <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#04121c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></div>
</div>
<div class="tag">AI TOOL วันนี้</div><div class="brand">botbas<b>.ai</b></div>
<div class="text">
 <div class="kick">{{KICKER_HTML}}</div>
 <div class="l1">{{LINE_1}}</div>
 <div class="hl a">{{BAR_1}}</div>
 <div class="hl b">{{BAR_2}}</div>
 <div class="sub">{{SUBLINE}}</div>
</div>
<div class="foot"><div>ใช้ AI ให้เป็น ทุกวัน 18:45</div><div>botbas.ai</div></div>
</body></html>
