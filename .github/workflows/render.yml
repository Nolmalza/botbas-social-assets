name: Render cards
on:
  push:
    paths: ['cards/**.html', '.github/workflows/render.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render changed cards to JPG
        run: |
          mkdir -p images
          for f in cards/*.html; do
            name=$(basename "$f" .html)
            ffmpeg -loglevel error -y -i "/tmp/$name.png" -q:v 3 "images/$name.jpg"
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1080,1080 --virtual-time-budget=5000 \
              --screenshot="/tmp/$name.png" "file://$PWD/$f"
            convert "/tmp/$name.png" -quality 88 "images/$name.jpg"
          done
      - name: Commit images
        run: |
          git config user.name "botbas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Render cards" && git push)
