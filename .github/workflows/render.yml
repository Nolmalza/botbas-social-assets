name: Render cards
on:
  push:
    paths: ['cards/**.html', '.github/workflows/render.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render cards to PNG
        run: |
          mkdir -p images
          for f in cards/*.html; do
            name=$(basename "$f" .html)
            [ -f "images/$name.png" ] && continue
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1080,1080 --virtual-time-budget=5000 \
              --screenshot="$PWD/images/$name.png" "file://$PWD/$f" 2>/dev/null
            test -s "images/$name.png"
          done
      - name: Commit images
        run: |
          git config user.name "botbas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Render cards" && git push)
